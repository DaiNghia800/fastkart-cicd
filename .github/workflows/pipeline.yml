name: CI/CD Production Pipeline
on:
  push:
    branches: [ main ]

jobs:
  # === JOB 1: CHỐT CHẶN KIỂM ĐỊNH CHẤT LƯỢNG ===
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix: 
        node: [18, 20]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: 
          node-version: '${{matrix.node}}'
        #  cache: 'npm'
      - run: npm install
      - run: npm test
      - run: npm audit || true

  # === JOB 2: ĐÚC DOCKER IMAGE & ĐẨY LÊN KHO ===
  build-push:
    needs: [test]
    runs-on: ubuntu-latest
    permissions: {contents: read, packages: write}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3 
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{github.actor}}
          password: ${{secrets.GITHUB_TOKEN}}
      - name: Convert repository name to lowercase
        run: echo "REPO_LC=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV
      - uses: docker/build-push-action@v5
        with:
          push: true
          tags: ghcr.io/${{ env.REPO_LC }}:${{github.sha}}
          cache-from: type=gha
          cache-to: type=gha,mode=max 

  # === JOB 3: GITOPS - BÁO CHO ARGOCD BIẾT ===
  deploy:
    needs: [build-push]
    environment: production
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v4
      - name: Convert repository name to lowercase
        run: echo "REPO_LC=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV
      - name: Update image tag and repo in values.yaml
        run: |
          # 1. Đổi tên kho mặc định (nginx) thành kho GHCR của mình
          sed -i "s|repository: .*|repository: ghcr.io/${{ env.REPO_LC }}|" fastkart-chart/values.yaml
          
          # 2. Đổi mã Tag
          sed -i "s/tag: .*/tag: ${{github.sha}}/" fastkart-chart/values.yaml
          
          git config user.email "ci-bot@github.com"
          git config user.name "CI Bot"
          git commit -am "ci: deploy target image ghcr.io/${{ env.REPO_LC }}:${{github.sha}}"
          git push
