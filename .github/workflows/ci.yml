name: Fastkart CI/CD Pipeline

on:
  push:
    branches: [ main ]

jobs:
  # ------ TẦNG 1: KIỂM ĐỊNH CHẤT LƯỢNG (CI) ------
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - run: npm test

  # ------ TẦNG 2: ĐÓNG GÓI VÀ VẬN CHUYỂN (CD) ------
  build-push:
    needs: [test] # QUAN TRỌNG: Phải pass bài test ở trên thì mới được chạy tầng này
    if: github.ref == 'refs/heads/main' # Chỉ áp dụng khi code vào nhánh main
    runs-on: ubuntu-latest
    
    # Cấp quyền cho Robot được ghi Image vào kho GHCR
    permissions:
      contents: read
      packages: write 

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }} # Tự động cấp quyền, zero setup

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
