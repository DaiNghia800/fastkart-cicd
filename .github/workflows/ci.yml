name: Fastkart CI/CD Pipeline

on:
  push:
    branches: [ main ]

jobs:
  # ------ TẦNG 1: KIỂM ĐỊNH CHẤT LƯỢNG (CI) ------
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - run: npm test

  # ------ TẦNG 2: ĐÓNG GÓI VÀ VẬN CHUYỂN (CD) ------
  build-push:
    needs: [test] # QUAN TRỌNG: Phải pass bài test ở trên thì mới được chạy tầng này
    if: github.ref == 'refs/heads/main' # Chỉ áp dụng khi code vào nhánh main
    runs-on: ubuntu-latest
    
    # Cấp quyền cho Robot được ghi Image vào kho GHCR
    permissions:
      contents: read
      packages: write 

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }} # Tự động cấp quyền, zero setup

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          push: true
          tags: ghcr.io/dainghia800/fastkart-cicd:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
  deploy-k8s:
    needs: [build-push]
    runs-on: ubuntu-latest
    
    # This triggers the manual approval pause configured in GitHub Settings
    environment: production 

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Setup Kubeconfig (Simulation)
        run: |
          echo "Simulating: Extracting KUBECONFIG from GitHub Secrets..."
          echo "Kubeconfig is ready!"
          
      - name: Deploy to K8s with Helm (Simulation)
        run: |
          echo "Simulating: Executing helm upgrade command..."
          echo "helm upgrade --install fastkart ./fastkart-chart --set image.tag=${{ github.sha }} --atomic"
          echo "Deployment successful! The app is now live. 🚀"
